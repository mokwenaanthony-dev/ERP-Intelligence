x-app-env: &app-env
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_HOST: db
  DB_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  # Unified Namespace bridge (Wave 6): off unless MQTT_URL is set in .env. The broker runs in the
  # MES-Intelligence repository; from these containers it is mqtt://host.docker.internal:1883.
  MQTT_URL: ${MQTT_URL:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn erp_system.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload --access-logfile -"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A erp_system worker --loglevel=info
    # The image's healthcheck calls the web API, which a worker doesn't serve: ask the worker instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A erp_system inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
    volumes:
      - .:/app
    env_file: .env
    environment: *app-env
    extra_hosts:  # the worker runs the UNS publisher; the broker is on the host (MES-Intelligence)
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Receives the MES's operation-performance events. Starts only with: docker compose --profile uns up
  uns_listener:
    build: .
    command: python manage.py uns_listen
    restart: unless-stopped
    profiles: ["uns"]
    volumes:
      - .:/app
    env_file: .env
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  celery_beat:
    build: .
    command: celery -A erp_system beat --loglevel=info --schedule /tmp/celerybeat-schedule
    # Beat only schedules tasks and has nothing to ping; its tasks show up in the worker's log.
    healthcheck:
      disable: true
    env_file: .env
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy

  # Knowledge graph (Neo4j Browser on http://localhost:7474, Bolt on 7687), fed from the outbox.
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  # BI dashboards on the analytics views (http://localhost:3000). Metabase keeps its own settings in
  # an embedded H2 database on the metabase_data volume; production would use a PostgreSQL database.
  metabase:
    image: metabase/metabase:v0.64.5.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  metabase_data:
  neo4j_data:
