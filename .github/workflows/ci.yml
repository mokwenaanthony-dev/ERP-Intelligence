# DevSecOps verification gates (design document, section 5):
# lint -> SAST -> dependency audit -> migrations check -> tests with coverage >= 80% -> Docker build
# Tests run against PostgreSQL and Neo4j service containers and a Mosquitto MQTT broker.
name: ERP CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-graph-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-graph-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-long-enough-for-hmac-sha256
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-graph-password
      MQTT_URL: mqtt://localhost:1883
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: erp_test
      DB_USER: erp
      DB_PASSWORD: erp
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Not a service container: Mosquitto 2 only accepts remote clients with a config file, and
      # service containers cannot be given a command. The image ships a no-auth config for testing.
      - name: Start MQTT broker (Mosquitto)
        run: docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2.0.20 mosquitto -c /mosquitto-no-auth.conf

      - name: Lint (flake8)
        run: flake8 .

      - name: Static security scan (bandit)
        run: bandit -r apps erp_system -ll -x "*/migrations/*"

      # pip-audit checks dependencies against the PyPI/OSV advisory databases
      # without needing an account (Safety 3 requires one).
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=erp_system.settings_test

      - name: Tests with coverage floor
        run: pytest

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t erp-system:ci .

  # ml_service (Wave 8a): its own dependencies, tests and image. The last step runs the built image
  # and checks that it answers the contract's worked example exactly (ADR 0014).
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml_service/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt flake8 bandit pip-audit

      - name: Lint (flake8)
        run: flake8 --max-line-length 120 .

      - name: Static security scan (bandit)
        run: bandit -r app -ll

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests with coverage floor
        run: pytest

      - name: Build image
        run: docker build -t ml-service:ci .

      - name: The image answers the contract example
        run: |
          docker run -d --name ml -p 8001:8001 -e ML_SERVICE_TOKEN=ci-only-token-0123456789 ml-service:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8001/health && break; sleep 1; done
          curl -sf -X POST http://localhost:8001/v1/forecast \
            -H "Content-Type: application/json" -H "X-Service-Token: ci-only-token-0123456789" \
            --data @contract/example_request.json -o answer.json
          python -c "import json,sys; a=json.load(open('answer.json')); e=json.load(open('contract/example_response.json')); sys.exit(0 if a == e else 'answer differs from contract/example_response.json')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/v1/forecast --data @contract/example_request.json)" = "401"
          docker logs ml
